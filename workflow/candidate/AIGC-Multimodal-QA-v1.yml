            "code": "import json\ndef main(body, status_code, fallback_details):\n    try:\n        if int(status_code)!=200: raise ValueError(f\"renderer status={status_code}\")\n        data=json.loads(body) if isinstance(body,str) else body; result=data.get(\"result\",{})\n        if not data.get(\"report_markdown\") or not result: raise ValueError(\"empty renderer response\")\n        return {\"report_markdown\":data[\"report_markdown\"],\"evaluation_result\":result,\"final_status\":str(result.get(\"status\",\"human_review_required\")),\"technical_details\":data.get(\"technical_details\",fallback_details)}\n    except Exception as exc:\n        result={\"asset_type\":\"video\",\"profile\":\"ad_video_v1\",\"status\":\"human_review_required\",\"overall_score\":0,\"summary\":\"报告渲染失败，需要人工复核。\",\"dimensions\":[],\"evidence\":[],\"issues\":[],\"strengths\":[],\"suggestions\":[],\"missing_information\":[\"rendered_report\"],\"confidence\":0.0,\"human_review_required\":True,\"human_review_reason\":\"报告渲染失败\",\"run_summary\":{\"steps\":0,\"completed_actions\":[],\"supplementary_frames_used\":False,\"retry_count\":0,\"stop_reason\":\"renderer_failed\"}}\n        return {\"report_markdown\":\"# AIGC 视频质量评估报告\\n\\n报告渲染失败，需要人工复核。\",\"evaluation_result\":result,\"final_status\":\"human_review_required\",\"technical_details\":{\"error\":str(exc),\"fallback\":fallback_details}}\n",
