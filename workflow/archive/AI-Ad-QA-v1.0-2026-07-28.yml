        template: "# AI广告素材质量分析报告\r\n\r\n## 素材信息\r\n\r\n- 视频ID：{{ video_id }}\r\n\
          - 视频时长：{{ duration }} 秒\r\n- 用户素材类型：{{ analysis.detected_material_type }}\r\
