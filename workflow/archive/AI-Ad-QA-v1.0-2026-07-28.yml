          \ }}/10\r\n- 评价证据置信度：{{ analysis.confidence }}/10\r\n\r\n## 素材类型判断\r\n\r\
          \n{% for item in analysis.classification_evidence %}\r\n- {{ item }}\r\n\
          {% endfor %}\r\n\r\n## 阶段评分\r\n\r\n### Hook\r\n\r\n{% if analysis.hook.status\
          \ == \"evaluated\" %}\r\n- 状态：已评价\r\n- 评分：{{ analysis.hook.score }}/10\r\
          \n{% elif analysis.hook.status == \"partial\" %}\r\n- 状态：部分评价，证据有限\r\n-\
          \ 评分：{{ analysis.hook.score }}/10\r\n{% elif analysis.hook.status == \"\
          not_present\" %}\r\n- 状态：完整广告中缺少Hook阶段\r\n{% else %}\r\n- 状态：不适用于当前素材\r\n\
          {% endif %}\r\n\r\n{% if analysis.hook.status != \"not_applicable\" %}\r\
          \n\r\n**判断依据**\r\n\r\n{% for item in analysis.hook.evidence %}\r\n- {{ item\
          \ }}\r\n{% endfor %}\r\n\r\n**主要问题**\r\n\r\n{% for item in analysis.hook.problems\
          \ %}\r\n- {{ item }}\r\n{% endfor %}\r\n\r\n**优化建议**\r\n\r\n{% for item\
          \ in analysis.hook.suggestions %}\r\n- {{ item }}\r\n{% endfor %}\r\n\r\n\
          {% endif %}\r\n\r\n### Intro\r\n\r\n{% if analysis.intro.status == \"evaluated\"\
          \ %}\r\n- 状态：已评价\r\n- 评分：{{ analysis.intro.score }}/10\r\n{% elif analysis.intro.status\
          \ == \"partial\" %}\r\n- 状态：部分评价，证据有限\r\n- 评分：{{ analysis.intro.score }}/10\r\
          \n{% elif analysis.intro.status == \"not_present\" %}\r\n- 状态：完整广告中缺少Intro阶段\r\
          \n{% else %}\r\n- 状态：不适用于当前素材\r\n{% endif %}\r\n\r\n{% if analysis.intro.status\
          \ != \"not_applicable\" %}\r\n\r\n**判断依据**\r\n\r\n{% for item in analysis.intro.evidence\
          \ %}\r\n- {{ item }}\r\n{% endfor %}\r\n\r\n**主要问题**\r\n\r\n{% for item\
          \ in analysis.intro.problems %}\r\n- {{ item }}\r\n{% endfor %}\r\n\r\n\
          **优化建议**\r\n\r\n{% for item in analysis.intro.suggestions %}\r\n- {{ item\
          \ }}\r\n{% endfor %}\r\n\r\n{% endif %}\r\n\r\n### Show\r\n\r\n{% if analysis.show.status\
          \ == \"evaluated\" %}\r\n- 状态：已评价\r\n- 评分：{{ analysis.show.score }}/10\r\
          \n{% elif analysis.show.status == \"partial\" %}\r\n- 状态：部分评价，证据有限\r\n-\
          \ 评分：{{ analysis.show.score }}/10\r\n{% elif analysis.show.status == \"\
