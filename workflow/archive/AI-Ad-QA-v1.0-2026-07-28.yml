          {% endif %}\r\n\r\n## 素材优势\r\n\r\n{% for item in analysis.strengths %}\r\
          \n- {{ item }}\r\n{% endfor %}\r\n\r\n## 核心问题\r\n\r\n{% for item in analysis.critical_problems\
